name: CI + Windows Release

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('release-{0}', github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Install project + tools
        run: |
          python -m pip install pip==26.2 setuptools==79.0.1
          pip install -r requirements-release.txt
          pip install --no-deps -e .
          pip install -r requirements-build.txt

      - name: Validate release lock and generate Python SBOM
        run: |
          python scripts/generate_release_sbom.py --validate-installed

      - name: Upload Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: python-sbom-windows
          path: release-sbom-python.cdx.json

      - name: Run tests (HTML report)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest --html=pytest-report.html --self-contained-html
          $code = $LASTEXITCODE
          Set-Content -Path .pytest_exitcode -Value $code

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: pytest-report.html
          if-no-files-found: ignore

      - name: Upload app logs (if present)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs
          path: logs/
          if-no-files-found: ignore

      - name: Fail build if tests failed
        if: always()
        shell: pwsh
        run: |
          $code = [int](Get-Content .pytest_exitcode)
          if ($code -ne 0) {
            Write-Host "Pytest failed with exit code $code"
            exit $code
          }

      - name: Build EXE (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm AkihabaraiScore.spec

      - name: Audit packaged native components
        run: |
          python scripts/audit_pyinstaller_build.py --toc build/AkihabaraiScore/PKG-00.toc

      - name: Upload native component inventory
        uses: actions/upload-artifact@v7
        with:
          name: native-inventory-windows
          path: release-native-inventory.json

      - name: Collect release license material
        run: |
          python scripts/collect_release_licenses.py

      - name: Prepare corresponding-source archives (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/prepare_source_archives.py --output release-sources

      - name: Collect Qt legal material from verified sources (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/collect_qt_source_legal.py

      - name: Smoke test EXE startup
        shell: pwsh
        run: |
          if (Test-Path dist\config) { Remove-Item -Recurse -Force dist\config }
          if (Test-Path dist\assets) { Remove-Item -Recurse -Force dist\assets }
          Copy-Item -Recurse -Force config dist\config
          Copy-Item -Recurse -Force assets dist\assets
          python scripts/smoke_test_packaged_app.py `
            --cwd dist `
            --log-dir dist/logs `
            --report exe-smoke-report.json `
            --timeout 15 `
            -- .\AkihabaraiScore.exe

      - name: Upload EXE smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exe-smoke-report
          path: exe-smoke-report.json
          if-no-files-found: ignore

      - name: Upload packaged app startup logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-app-logs-windows
          path: dist/logs/
          if-no-files-found: ignore

      - name: Assemble portable folder
        run: |
          if (Test-Path release) { Remove-Item -Recurse -Force release }
          New-Item -ItemType Directory -Path release | Out-Null
          New-Item -ItemType Directory -Path release\docs | Out-Null
          Copy-Item dist\AkihabaraiScore.exe release\AkihabaraiScore.exe
          Copy-Item -Recurse -Force config release\config
          Copy-Item -Recurse -Force assets release\assets
          Copy-Item LICENSE release\LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md release\THIRD_PARTY_NOTICES.md
          Copy-Item BRAND_POLICY.md release\docs\BRAND_POLICY.md
          Copy-Item CREATOR_GUIDELINES.md release\docs\CREATOR_GUIDELINES.md
          Copy-Item docs\compliance\release_source_availability.md release\docs\SOURCE_AVAILABILITY.md
          Copy-Item -Recurse -Force build\release-legal release\licenses
          Copy-Item release-sbom-python.cdx.json release\licenses\release-sbom-python.cdx.json
          Copy-Item release-native-inventory.json release\licenses\release-native-inventory.json
          Copy-Item compliance\source-archives.json release\licenses\source-archives.json
          Copy-Item compliance\asset-provenance.json release\licenses\project-assets.json
          Copy-Item compliance\windows-runtime-provenance.json release\licenses\microsoft-runtime.json
          if (-not (Test-Path release\config\locales\hu.json)) {
            throw "Hungarian locale catalog is missing from the portable package"
          }
          if (-not (Test-Path release\config\locales\en.json)) {
            throw "English locale catalog is missing from the portable package"
          }

      - name: Validate portable Windows folder
        run: |
          python scripts/validate_portable_release.py --platform windows

      - name: Validate tag-only Windows legal material
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/validate_portable_release.py --platform windows --tag-build

      - name: Zip portable package
        run: |
          powershell -Command "Compress-Archive -Path release\* -DestinationPath AkihabaraiScore-windows.zip -Force"

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: AkihabaraiScore-windows.zip
