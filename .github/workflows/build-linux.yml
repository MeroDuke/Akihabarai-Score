name: CI + Linux Build

on:
  push:
    branches:
      - main
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('release-{0}', github.ref) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Install Qt runtime packages
        run: |
          sudo apt-get update
          xargs -a packaging/linux/ubuntu-24.04-runtime-packages.txt sudo apt-get install -y
          sudo apt-get install -y xvfb

      - name: Install project + tools
        run: |
          python -m pip install pip==26.2 setuptools==79.0.1
          pip install -r requirements-release.txt
          pip install --no-deps -e .
          pip install -r requirements-build.txt

      - name: Validate release lock and generate Python SBOM
        run: |
          python scripts/generate_release_sbom.py --validate-installed
          python scripts/prepare_source_archives.py --validate-only

      - name: Upload Python SBOM
        uses: actions/upload-artifact@v7
        with:
          name: python-sbom-linux
          path: release-sbom-python.cdx.json

      - name: Run tests
        run: |
          pytest --html=pytest-report-linux.html --self-contained-html

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-linux
          path: pytest-report-linux.html
          if-no-files-found: ignore

      - name: Build Linux binary (PyInstaller)
        run: |
          pyinstaller --clean --noconfirm AkihabaraiScore.spec

      - name: Audit packaged native components
        run: |
          python scripts/audit_pyinstaller_build.py --toc build/AkihabaraiScore/PKG-00.toc

      - name: Upload native component inventory
        uses: actions/upload-artifact@v7
        with:
          name: native-inventory-linux
          path: release-native-inventory.json

      - name: Collect release license material
        run: |
          python scripts/collect_release_licenses.py

      - name: Prepare corresponding-source archives (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/prepare_source_archives.py --output release-sources

      - name: Collect Qt legal material from verified sources (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python scripts/collect_qt_source_legal.py

      - name: Map Linux native packages and collect legal files
        run: |
          python scripts/collect_linux_native_licenses.py

      - name: Upload Linux native compliance inventory
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-compliance
          path: |
            release-linux-packages.json
            build/release-legal/linux-packages/

      - name: Assemble portable folder
        run: |
          rm -rf release
          mkdir -p release
          cp dist/AkihabaraiScore release/AkihabaraiScore
          cp -R config release/config
          cp -R assets release/assets
          cp LICENSE release/LICENSE
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          cp release-sbom-python.cdx.json release/release-sbom-python.cdx.json
          cp release-native-inventory.json release/release-native-inventory.json
          cp release-linux-packages.json release/release-linux-packages.json
          cp compliance/source-archives.json release/source-archives.json
          cp docs/release_source_availability.md release/SOURCE_AVAILABILITY.md
          cp packaging/linux/README.md release/LINUX_RUNTIME.md
          cp packaging/linux/ubuntu-24.04-runtime-packages.txt release/ubuntu-24.04-runtime-packages.txt
          cp -R build/release-legal release/licenses
          cp compliance/asset-provenance.json release/licenses/project-assets.json
          chmod +x release/AkihabaraiScore
          test -f release/config/locales/hu.json
          test -f release/config/locales/en.json

      - name: Smoke test Linux binary startup
        run: |
          set -euo pipefail
          xvfb-run -a ./release/AkihabaraiScore &
          app_pid=$!
          sleep 5

          if kill -0 "$app_pid" 2>/dev/null; then
            kill "$app_pid"
            wait "$app_pid" || true
            echo "Linux startup smoke passed"
          else
            wait "$app_pid"
          fi

      - name: Upload app logs (if present)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs-linux
          path: release/logs/
          if-no-files-found: ignore

      - name: Package portable Linux artifact
        run: |
          rm -rf release/logs
          tar -czf AkihabaraiScore-linux-x86_64.tar.gz -C release .

      - name: Create GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            AkihabaraiScore-linux-x86_64.tar.gz
            release-sources/*
